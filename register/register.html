<!doctype html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Chad Chad — สร้างบัญชีใหม่" />
  <title>Chad Chad — สร้างบัญชีใหม่</title>
  <link rel="icon" type="image/x-icon" href="/ChadChad/favicon.ico" />
  <script type="module" crossorigin src="/ChadChad/assets/register-PARtis4M.js"></script>
  <link rel="modulepreload" crossorigin href="/ChadChad/assets/config-C-jM1Y5x.js">
  <link rel="stylesheet" crossorigin href="/ChadChad/assets/config-C3M8t5Lg.css">
</head>

<body class="min-h-screen bg-slate-50 flex items-center justify-center px-4 py-8 font-inter">

  <div class="w-full max-w-md animate-fadeInUp">
    <!-- Card -->
    <div class="bg-white rounded-3xl shadow-xl p-10">

      <!-- Title -->
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-blue-500 font-mitr">Chad Chad</h1>
        <p class="text-slate-400 text-sm mt-1">สร้างบัญชีใหม่เพื่อเริ่มฝึกออกเสียง</p>
      </div>

      <!-- Register Form -->
      <form id="register-form" class="space-y-4">
        <div>
          <label for="reg-name" class="block text-sm font-medium text-slate-600 mb-1.5">ชื่อ</label>
          <input type="text" id="reg-name" required placeholder="ชื่อของคุณ"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" />
        </div>
        <div>
          <label for="reg-email" class="block text-sm font-medium text-slate-600 mb-1.5">อีเมล</label>
          <input type="email" id="reg-email" required placeholder="you@example.com"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" />
        </div>
        <div>
          <label for="reg-password" class="block text-sm font-medium text-slate-600 mb-1.5">รหัสผ่าน</label>
          <input type="password" id="reg-password" required placeholder="อย่างน้อย 6 ตัวอักษร" minlength="6"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" />
        </div>
        <div>
          <label for="reg-confirm-password"
            class="block text-sm font-medium text-slate-600 mb-1.5">ยืนยันรหัสผ่าน</label>
          <input type="password" id="reg-confirm-password" required placeholder="กรอกรหัสผ่านอีกครั้ง" minlength="6"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" />
        </div>

        <!-- Register Button -->
        <button type="submit" id="btn-submit-register"
          class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3.5 rounded-xl shadow-md shadow-blue-500/25 hover:shadow-blue-500/40 transition-all duration-200 active:scale-[0.98] text-sm cursor-pointer">
          สร้างบัญชี
        </button>
      </form>

      <!-- Back to Login -->
      <button type="button" id="btn-back-login"
        class="w-full mt-3 bg-white text-blue-500 font-semibold py-3.5 rounded-xl border-2 border-blue-200 hover:border-blue-400 hover:bg-blue-50 transition-all duration-200 active:scale-[0.98] text-sm cursor-pointer">
        กลับไปหน้าเข้าสู่ระบบ
      </button>

      <!-- Error Message (inline, not popup) -->
      <p id="register-error" class="text-red-500 text-sm text-center mt-4 hidden"></p>

      <!-- Success Message -->
      <p id="register-success" class="text-green-500 text-sm text-center mt-4 hidden"></p>

      <!-- Loading Spinner -->
      <div id="register-loading" class="hidden flex justify-center mt-4">
        <div class="w-6 h-6 border-2 border-blue-200 border-t-blue-500 rounded-full animate-spin"></div>
      </div>
    </div>
  </div>

</body>

</html>
