<!doctype html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Chad Chad — เข้าสู่ระบบ" />
  <title>Chad Chad — เข้าสู่ระบบ</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
</head>

<body class="min-h-screen bg-slate-50 flex items-center justify-center px-4 py-8 font-inter">

  <div class="w-full max-w-md animate-fadeInUp">
    <!-- Card -->
    <div class="bg-white rounded-3xl shadow-xl p-10">

      <!-- Title -->
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-blue-500 font-mitr">Chad Chad</h1>
        <p class="text-slate-400 text-sm mt-1">เข้าสู่ระบบเพื่อฝึกออกเสียง</p>
      </div>

      <!-- Google Sign-In -->
      <button id="btn-google"
        class="w-full flex items-center justify-center gap-3 px-4 py-3.5 rounded-xl font-medium text-slate-600 text-sm bg-white border-2 border-slate-300 hover:bg-slate-50 hover:border-blue-400 hover:shadow-md transition-all duration-200 active:scale-[0.98] cursor-pointer">
        <svg width="20" height="20" viewBox="0 0 48 48">
          <path fill="#EA4335"
            d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
          <path fill="#4285F4"
            d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
          <path fill="#FBBC05"
            d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
          <path fill="#34A853"
            d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
        </svg>
        เข้าสู่ระบบด้วย Google
      </button>

      <!-- Divider -->
      <div class="flex items-center gap-3 my-6">
        <div class="flex-1 h-px bg-slate-200"></div>
        <span class="text-xs text-slate-400">หรือ</span>
        <div class="flex-1 h-px bg-slate-200"></div>
      </div>

      <!-- Email/Password Form -->
      <form id="login-form" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-slate-600 mb-1.5">อีเมล</label>
          <input type="email" id="email" required placeholder="you@example.com"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-slate-600 mb-1.5">รหัสผ่าน</label>
          <input type="password" id="password" required placeholder="••••••••"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" />
        </div>

        <!-- Login Button -->
        <button type="submit" id="btn-login"
          class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3.5 rounded-xl shadow-md shadow-blue-500/25 hover:shadow-blue-500/40 transition-all duration-200 active:scale-[0.98] text-sm cursor-pointer">
          เข้าสู่ระบบ
        </button>
      </form>

      <!-- Register Button -->
      <button type="button" id="btn-register"
        class="w-full mt-3 bg-white text-blue-500 font-semibold py-3.5 rounded-xl border-2 border-blue-200 hover:border-blue-400 hover:bg-blue-50 transition-all duration-200 active:scale-[0.98] text-sm cursor-pointer">
        สร้างบัญชีใหม่
      </button>

      <!-- Error Message (inline, not popup) -->
      <p id="login-error" class="text-red-500 text-sm text-center mt-4 hidden"></p>

      <!-- Loading Spinner -->
      <div id="login-loading" class="hidden flex justify-center mt-4">
        <div class="w-6 h-6 border-2 border-blue-200 border-t-blue-500 rounded-full animate-spin"></div>
      </div>

      <!-- Divider -->
      <div class="flex items-center gap-3 mt-6">
        <div class="flex-1 h-px bg-slate-200"></div>
        <span class="text-xs text-slate-300">สำหรับผู้ดูแลระบบ</span>
        <div class="flex-1 h-px bg-slate-200"></div>
      </div>

      <!-- Admin Button -->
      <button type="button" id="btn-admin"
        class="w-full mt-3 bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3.5 rounded-xl shadow-md shadow-blue-500/25 hover:shadow-blue-500/40 transition-all duration-200 active:scale-[0.98] text-sm cursor-pointer flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        เข้าหน้าผู้ดูแลระบบ (Admin)
      </button>
    </div>
  </div>

  <script type="module" src="./login.js"></script>
</body>

</html>
